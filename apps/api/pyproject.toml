[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "hostel-api"
version = "0.1.0"
description = "AI-Powered Smart Hostel Management and Data Analytics System"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "python-multipart>=0.0.12",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "google-genai>=0.8",
  "structlog>=24.4",
  "httpx>=0.27",
  "pypdf>=5.1",
  "python-magic>=0.4.27",
  "tenacity>=9.0",
  # Report exports. uharfbuzz lets reportlab shape Devanagari correctly.
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "uharfbuzz>=0.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0",
  "ruff>=0.8", "mypy>=1.13", "factory-boy>=3.3",
  "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "TID"]
ignore = [
  "S101",   # assert: used intentionally in tests and as internal invariants
  "B008",   # function call in default arg: this is how FastAPI Depends() works
  "UP042",  # str+Enum: native PG enums are keyed on member NAME; switching to
            # StrEnum would change persisted values for no benefit
  "UP046",  # Generic[T] on Page: kept for clarity of the pagination envelope
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# token_type="access"/"bearer" is a token DISCRIMINATOR, not a credential.
# Verified by inspection; ignored narrowly rather than globally.
"app/core/security.py" = ["S105"]
"app/schemas/common.py" = ["S105"]
"app/services/auth.py" = ["S106"]
"alembic/*" = ["E501"]

# Enforce the provider-isolation rule: only app/ai/providers/gemini.py may import the SDK.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"google.genai".msg = "Import the Gemini SDK ONLY in app/ai/providers/gemini.py. Depend on LLMProvider/EmbeddingProvider instead."

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
