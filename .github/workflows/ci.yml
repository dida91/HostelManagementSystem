name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hostel
          POSTGRES_PASSWORD: hostel
          POSTGRES_DB: hostel
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U hostel" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20

    env:
      APP_ENV: test
      AI_REQUIRED: "false"          # CI must not depend on a live key
      DATABASE_URL: postgresql+asyncpg://hostel:hostel@localhost:5434/hostel
      DATABASE_URL_SYNC: postgresql+psycopg://hostel:hostel@localhost:5434/hostel
      REDIS_URL: redis://localhost:6380/0
      CELERY_BROKER_URL: redis://localhost:6380/1
      CELERY_RESULT_BACKEND: redis://localhost:6380/2
      SECRET_KEY: ci-only-not-a-real-secret

    defaults:
      run: { working-directory: apps/api }

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"

      - name: Lint (includes the Gemini-SDK import boundary)
        run: ./.venv/bin/ruff check app tests

      - name: Format check
        run: ./.venv/bin/ruff format --check app tests

      - name: Types
        run: ./.venv/bin/mypy app

      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          ./.venv/bin/alembic upgrade head
          ./.venv/bin/alembic downgrade base
          ./.venv/bin/alembic upgrade head

      - name: No model/migration drift
        run: ./.venv/bin/alembic check

      - name: Seed and test
        run: |
          ./.venv/bin/python scripts_seed.py
          ./.venv/bin/python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
